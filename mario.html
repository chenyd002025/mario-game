<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Super Mario</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #000; display: flex; justify-content: center; align-items: center; height: 100vh; height: 100dvh; overflow: hidden; touch-action: none; -webkit-touch-callout: none; user-select: none; -webkit-user-select: none; }
canvas { display: block; image-rendering: pixelated; max-width: 100vw; max-height: 100vh; max-height: 100dvh; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
canvas.width = 800;
canvas.height = 480;
const W = canvas.width, H = canvas.height;
const TILE = 32;

// ===== Audio System =====
let audioCtx = null;
function ensureAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); return audioCtx; }

function playTone(freq, duration, type, vol, delay) {
  try {
    const ac = ensureAudio();
    const t = ac.currentTime + (delay || 0);
    const o = ac.createOscillator();
    const g = ac.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(vol || 0.08, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + duration);
    o.connect(g); g.connect(ac.destination);
    o.start(t); o.stop(t + duration);
  } catch(e) {}
}

function sfxJump() { playTone(400, 0.1, 'square', 0.1); playTone(600, 0.15, 'square', 0.1, 0.05); }
function sfxCoin() { playTone(988, 0.08, 'square', 0.08); playTone(1319, 0.2, 'square', 0.08, 0.08); }
function sfxStomp() { playTone(200, 0.15, 'triangle', 0.12); playTone(400, 0.1, 'triangle', 0.08, 0.05); }
function sfxBreak() { playTone(300, 0.05, 'square', 0.1); playTone(200, 0.08, 'square', 0.08, 0.03); }
function sfxPowerup() { [523,659,784,1047].forEach((f,i) => playTone(f, 0.12, 'square', 0.07, i*0.08)); }
function sfxDeath() { playTone(400, 0.15, 'square', 0.1); playTone(300, 0.15, 'square', 0.1, 0.15); playTone(200, 0.3, 'square', 0.1, 0.3); }
function sfxGameOver() { [392,330,262,220,175].forEach((f,i) => playTone(f, 0.25, 'square', 0.08, i*0.2)); }
function sfxClear() { [523,587,659,784,880,1047].forEach((f,i) => playTone(f, 0.15, 'square', 0.08, i*0.1)); }

// Background music - Mario theme (chip tune)
const THEME_NOTES = [
  [659,0.12],[659,0.12],[0,0.12],[659,0.12],[0,0.12],[523,0.12],[659,0.12],[0,0.12],
  [784,0.2],[0,0.2],[392,0.2],[0,0.2],
  [523,0.15],[0,0.1],[392,0.15],[0,0.1],[330,0.15],[0,0.1],
  [440,0.12],[0,0.06],[494,0.12],[0,0.06],[466,0.06],[440,0.12],[0,0.06],
  [392,0.1],[659,0.1],[784,0.12],[0,0.06],[880,0.12],[0,0.06],
  [698,0.12],[784,0.12],[0,0.06],[659,0.12],[0,0.06],
  [523,0.12],[587,0.12],[494,0.15],[0,0.2],
];
let bgmPlaying = false, bgmTimer = null, bgmNoteIdx = 0;
function startBGM() {
  if (bgmPlaying) return;
  bgmPlaying = true; bgmNoteIdx = 0;
  function playNext() {
    if (!bgmPlaying) return;
    const [freq, dur] = THEME_NOTES[bgmNoteIdx % THEME_NOTES.length];
    if (freq > 0) playTone(freq, dur * 0.9, 'square', 0.04);
    bgmNoteIdx++;
    bgmTimer = setTimeout(playNext, dur * 1000);
  }
  playNext();
}
function stopBGM() { bgmPlaying = false; if (bgmTimer) clearTimeout(bgmTimer); bgmTimer = null; }

const IMG = {};
let imgLoaded = 0;
const IMG_COUNT = 50;
let imgsReady = false;

function loadImg(name, src) {
  IMG[name] = new Image();
  IMG[name].onload = () => { imgLoaded++; if (imgLoaded >= IMG_COUNT) imgsReady = true; };
  IMG[name].onerror = () => { imgLoaded++; if (imgLoaded >= IMG_COUNT) imgsReady = true; };
  IMG[name].src = src;
}

loadImg('bg', 'mario_assets/background.png');
loadImg('brick', 'mario_assets/brick_tile.png');
loadImg('qblock', 'mario_assets/question_block.png');
loadImg('pipe', 'mario_assets/pipe_sprite.png');
loadImg('tiles', 'mario_assets/tiles.png');
loadImg('clouds', 'mario_assets/clouds.png');
loadImg('mountain', 'mario_assets/mountain.png');
loadImg('hud', 'mario_assets/hud.png');
loadImg('title', 'mario_assets/title.png');
loadImg('gameover', 'mario_assets/gameover.png');

for (let i = 0; i < 4; i++) loadImg('coin_f' + i, 'mario_assets/coin_frame_' + i + '.png');

for (let i = 0; i < 4; i++) loadImg('m_idle' + i, 'mario_assets/mario_idle_' + i + '.png');
for (let i = 0; i < 4; i++) loadImg('m_run' + i, 'mario_assets/mario_run_' + i + '.png');
for (let i = 0; i < 4; i++) loadImg('m_jump' + i, 'mario_assets/mario_jump_' + i + '.png');
for (let i = 0; i < 4; i++) loadImg('m_duck' + i, 'mario_assets/mario_duck_' + i + '.png');
for (let i = 0; i < 4; i++) loadImg('m_atk' + i, 'mario_assets/mario_attack_' + i + '.png');
for (let i = 0; i < 3; i++) loadImg('g_idle' + i, 'mario_assets/goomba_idle_' + i + '.png');
for (let i = 0; i < 2; i++) loadImg('g_walk' + i, 'mario_assets/goomba_walk_' + i + '.png');
for (let i = 0; i < 2; i++) loadImg('k_walk' + i, 'mario_assets/koopa_walk_' + i + '.png');
for (let i = 0; i < 2; i++) loadImg('k_shell' + i, 'mario_assets/koopa_shell_' + i + '.png');
loadImg('heart_full', 'mario_assets/heart_full.png');
loadImg('heart_empty', 'mario_assets/heart_empty.png');
loadImg('pw_mush', 'mario_assets/pw_mushroom.png');
loadImg('pw_flwr', 'mario_assets/pw_flower.png');
loadImg('pw_star', 'mario_assets/pw_star.png');
loadImg('m_portrait', 'mario_assets/mario_portrait.png');
loadImg('l_portrait', 'mario_assets/luigi_portrait.png');

let titleScreen = true;
let coinAnimFrame = 0;
let coinAnimTimer = 0;
let marioAnimFrame = 0;
let marioAnimTimer = 0;
const GRAVITY = 0.55;
const JUMP_FORCE = -10;
const MOVE_SPEED = 3.5;
const FRICTION = 0.85;

let camX = 0, coins = 0, score = 0, lives = 3;
let gameOver = false, won = false, levelComplete = false, levelTimer = 300;
let keys = {};
let animFrame = 0;

const MAP_W = 210, MAP_H = 15;
const GROUND_Y = MAP_H - 2;

const COL = {
  AIR: 0, GROUND: 1, BRICK: 2, QUESTION: 3, HARD: 4,
  PIPE_TL: 5, PIPE_TR: 6, PIPE_BL: 7, PIPE_BR: 8,
  USED: 9, COIN_BLOCK: 10, FLAG_POLE: 11, FLAG_TOP: 12
};

let grid = [];
let entities = [];
let particles = [];
let floatingTexts = [];
let player;

function initGrid() {
  grid = [];
  for (let y = 0; y < MAP_H; y++) {
    grid[y] = [];
    for (let x = 0; x < MAP_W; x++) {
      if (y >= GROUND_Y) grid[y][x] = COL.GROUND;
      else grid[y][x] = COL.AIR;
    }
  }

  // gaps
  for (let x = 69; x < 72; x++) for (let y = GROUND_Y; y < MAP_H; y++) grid[y][x] = COL.AIR;
  for (let x = 115; x < 119; x++) for (let y = GROUND_Y; y < MAP_H; y++) grid[y][x] = COL.AIR;
  for (let x = 155; x < 158; x++) for (let y = GROUND_Y; y < MAP_H; y++) grid[y][x] = COL.AIR;

  // bricks and question blocks
  function placeBlock(bx, by, type) { if (by >= 0 && by < MAP_H && bx >= 0 && bx < MAP_W) grid[by][bx] = type; }

  // section 1 - no blocks near first gap, only high platforms
  placeBlock(23, 5, COL.QUESTION);

  // stairs and pipes
  placePipe(28, GROUND_Y - 2, 2);
  placePipe(38, GROUND_Y - 2, 2);
  placePipe(46, GROUND_Y - 3, 3);
  placePipe(57, GROUND_Y - 3, 3);

  // section 2 - high platforms only (y=5), nothing at y=9
  placeBlock(80, 5, COL.BRICK); placeBlock(81, 5, COL.BRICK);
  placeBlock(82, 5, COL.BRICK); placeBlock(83, 5, COL.BRICK);
  placeBlock(84, 5, COL.BRICK); placeBlock(85, 5, COL.BRICK);
  placeBlock(86, 5, COL.BRICK); placeBlock(87, 5, COL.BRICK);
  placeBlock(91, 5, COL.BRICK); placeBlock(92, 5, COL.BRICK);
  placeBlock(93, 5, COL.BRICK); placeBlock(94, 5, COL.QUESTION);

  placePipe(105, GROUND_Y - 2, 2);
  placePipe(112, GROUND_Y - 2, 2);

  // section 3 - high platforms only
  placeBlock(130, 5, COL.BRICK); placeBlock(131, 5, COL.BRICK);
  placeBlock(132, 5, COL.QUESTION); placeBlock(133, 5, COL.BRICK);

  placePipe(140, GROUND_Y - 2, 2);
  placePipe(148, GROUND_Y - 2, 2);

  // section 4 - high platforms near flag
  placeBlock(160, 5, COL.BRICK);
  placeBlock(161, 5, COL.QUESTION); placeBlock(162, 5, COL.BRICK);

  // flag - no stairs, clear path to flag
  placeBlock(185, GROUND_Y - 1, COL.FLAG_POLE);
  for (let y = 3; y < GROUND_Y - 1; y++) placeBlock(185, y, COL.FLAG_POLE);
  placeBlock(185, 2, COL.FLAG_TOP);
}

function placePipe(px, py, height) {
  grid[py][px] = COL.PIPE_TL; grid[py][px + 1] = COL.PIPE_TR;
  for (let y = py + 1; y < py + height; y++) {
    if (y < MAP_H) { grid[y][px] = COL.PIPE_BL; grid[y][px + 1] = COL.PIPE_BR; }
  }
}

function initEntities() {
  entities = [];

  function addGoomba(ex) { entities.push({ type: 'goomba', x: ex * TILE, y: (GROUND_Y - 1) * TILE, vx: -1, vy: 0, w: 28, h: 28, alive: true, stomped: 0, frame: 0 }); }
  function addKoopa(ex) { entities.push({ type: 'koopa', x: ex * TILE, y: (GROUND_Y - 1) * TILE - 8, vx: -1, vy: 0, w: 28, h: 36, alive: true, stomped: 0, frame: 0 }); }

  addGoomba(22); addGoomba(24); addGoomba(40); addGoomba(42);
  addGoomba(55); addGoomba(78); addGoomba(82); addGoomba(86);
  addKoopa(60); addGoomba(97); addGoomba(100);
  addGoomba(128); addGoomba(132); addKoopa(145);
  addGoomba(160); addGoomba(165); addGoomba(175);
}

function initPlayer() {
  player = {
    x: 3 * TILE, y: (GROUND_Y - 1) * TILE - 32,
    vx: 0, vy: 0, w: 24, h: 30,
    onGround: false, big: false, invincible: 0,
    facing: 1, walkFrame: 0, walkTimer: 0, dead: false, deadTimer: 0
  };
}

function resetLevel() {
  initGrid();
  initEntities();
  initPlayer();
  camX = 0; coins = 0; score = 0;
  levelComplete = false; gameOver = false; won = false;
  levelTimer = 300;
  particles = []; floatingTexts = [];
}

function init() { lives = 3; resetLevel(); }

function getBlock(x, y) {
  if (x < 0 || x >= MAP_W || y < 0 || y >= MAP_H) return COL.AIR;
  return grid[y][x];
}

function setBlock(x, y, v) {
  if (x >= 0 && x < MAP_W && y >= 0 && y < MAP_H) grid[y][x] = v;
}

function hitBlock(bx, by) {
  let b = getBlock(bx, by);
  if (b === COL.QUESTION || b === COL.COIN_BLOCK) {
    setBlock(bx, by, COL.USED);
    coins++; score += 200;
    sfxCoin();
    floatingTexts.push({ x: bx * TILE + 8, y: by * TILE - 10, text: '200', timer: 40, vy: -1.5 });
    spawnCoinParticle(bx * TILE + TILE / 2, by * TILE);
    if (coins % 10 === 0) { lives++; floatingTexts.push({ x: bx * TILE, y: by * TILE - 30, text: '1UP', timer: 60, vy: -1 }); }
  } else if (b === COL.BRICK) {
    setBlock(bx, by, COL.AIR);
    score += 50;
    sfxBreak();
    for (let i = 0; i < 4; i++) {
      particles.push({ x: bx * TILE + (i % 2) * 16, y: by * TILE + Math.floor(i / 2) * 16, vx: (i % 2 === 0 ? -2 : 2) + Math.random(), vy: -4 - Math.random() * 3, size: 8, color: '#c84', life: 50, type: 'debris' });
    }
  }
}

function spawnCoinParticle(px, py) {
  particles.push({ x: px, y: py, vx: 0, vy: -6, size: 10, color: '#ff0', life: 30, type: 'coin' });
}

function rectOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}

function update() {
  if (gameOver || won) return;

  animFrame++;
  levelTimer -= 1 / 60;
  if (levelTimer <= 0) { killPlayer(); return; }

  // Fall death - if player falls below screen
  if (player.y > H + 50) {
    lives--;
    sfxDeath();
    if (lives <= 0) { gameOver = true; return; }
    initPlayer(); camX = 0;
    return;
  }

  if (player.dead) {
    player.deadTimer--;
    if (player.deadTimer > 20) player.vy = -6;
    else player.vy += GRAVITY;
    player.y += player.vy;
    if (player.deadTimer <= 0) {
      lives--;
      if (lives <= 0) { gameOver = true; return; }
      stopBGM(); sfxGameOver();
      initPlayer(); camX = 0;
    }
    return;
  }

  if (levelComplete) {
    player.vy += GRAVITY;
    player.y += player.vy;
    if (player.y >= (GROUND_Y - 1) * TILE - player.h) { player.y = (GROUND_Y - 1) * TILE - player.h; player.vy = 0; player.onGround = true; }
    return;
  }

  if (keys['ArrowLeft'] || keys['a']) { player.vx -= 0.4; player.facing = -1; }
  if (keys['ArrowRight'] || keys['d']) { player.vx += 0.4; player.facing = 1; }

  if ((keys['ArrowUp'] || keys['w'] || keys[' ']) && player.onGround) {
    player.vy = JUMP_FORCE - (Math.abs(player.vx) > 2 ? 1.5 : 0);
    sfxJump();
    player.onGround = false;
  }

  if (!(keys['ArrowLeft'] || keys['a'] || keys['ArrowRight'] || keys['d'])) {
    player.vx *= FRICTION;
  }
  player.vx = Math.max(-MOVE_SPEED, Math.min(MOVE_SPEED, player.vx));
  if (Math.abs(player.vx) < 0.1) player.vx = 0;

  if (player.invincible > 0) player.invincible--;

  player.vy += GRAVITY;
  if (player.vy > 10) player.vy = 10;

  player.x += player.vx;
  resolveCollisionX();
  player.y += player.vy;
  resolveCollisionY();

  player.x = Math.max(0, player.x);
  if (player.x < camX + 10) player.x = camX + 10;

  if (player.onGround && Math.abs(player.vx) > 0.5) {
    player.walkTimer++;
    if (player.walkTimer > 6) { player.walkTimer = 0; player.walkFrame = (player.walkFrame + 1) % 3; }
  } else { player.walkFrame = 0; player.walkTimer = 0; }

  let targetCam = player.x - W / 3;
  if (targetCam > camX) camX += (targetCam - camX) * 0.1;
  camX = Math.max(0, Math.min(MAP_W * TILE - W, camX));

  for (let e of entities) {
    if (!e.alive) continue;
    if (e.stomped > 0) { e.stomped--; continue; }
    e.vy += GRAVITY;
    e.x += e.vx;
    e.y += e.vy;
    e.frame++;

    let eCenterX = Math.floor((e.x + e.w / 2) / TILE);
    let eLeftX = Math.floor((e.x + 2) / TILE);
    let eRightX = Math.floor((e.x + e.w - 2) / TILE);
    let eBotY = Math.floor((e.y + e.h) / TILE);

    if (eBotY >= 0 && eBotY < MAP_H && e.vy >= 0) {
      let onGround = false;
      for (let checkX of [eLeftX, eCenterX, eRightX]) {
        if (checkX >= 0 && checkX < MAP_W && grid[eBotY][checkX] !== COL.AIR) {
          onGround = true;
          break;
        }
      }
      if (onGround) {
        e.y = eBotY * TILE - e.h;
        e.vy = 0;
      }
    }

    if (e.vx !== 0) {
      let wallX = e.vx > 0 ? Math.floor((e.x + e.w + 1) / TILE) : Math.floor((e.x - 1) / TILE);
      let wallY = Math.floor((e.y + e.h / 2) / TILE);
      if (wallY >= 0 && wallY < MAP_H && wallX >= 0 && wallX < MAP_W && isSolid(grid[wallY][wallX])) {
        e.vx = -e.vx;
      }
    }

    if (e.x < -50 || e.x > MAP_W * TILE + 50) e.alive = false;

    if (e.alive && e.stomped === 0) {
      let pBox = { x: player.x - player.w / 2, y: player.y, w: player.w, h: player.h };
      let eBox = { x: e.x, y: e.y, w: e.w, h: e.h };
      if (rectOverlap(pBox, eBox)) {
        if (player.vy > 0 && player.y + player.h - 4 < e.y + e.h / 2) {
          e.stomped = 20;
          sfxStomp();
          e.h = 14;
          player.vy = -7;
          score += 100;
          floatingTexts.push({ x: e.x, y: e.y - 10, text: '100', timer: 30, vy: -1.5 });
        } else if (player.invincible === 0) {
          killPlayer();
        }
      }
    }
  }
  entities = entities.filter(e => e.alive || e.stomped > 0);

  for (let p of particles) {
    p.x += p.vx; p.y += p.vy;
    if (p.type === 'debris') p.vy += 0.3;
    p.life--;
  }
  particles = particles.filter(p => p.life > 0);

  for (let f of floatingTexts) { f.y += f.vy; f.timer--; }
  floatingTexts = floatingTexts.filter(f => f.timer > 0);

  // flag collision -只要走到旗杆区域就通关
  let flagTileX = 185;
  let playerTileX = Math.floor(player.x / TILE);
  if (playerTileX >= flagTileX - 2) {
    if (!levelComplete && !won) {
      levelComplete = true;
      stopBGM(); sfxClear();
      won = true;
      score += Math.floor(levelTimer) * 50;
    }
  }
}

function isSolid(b) {
  return b === COL.GROUND || b === COL.BRICK || b === COL.QUESTION || b === COL.HARD ||
         b === COL.PIPE_TL || b === COL.PIPE_TR || b === COL.PIPE_BL || b === COL.PIPE_BR;
}

function resolveCollisionX() {
  let halfW = player.w / 2;
  let left = Math.floor((player.x - halfW) / TILE);
  let right = Math.floor((player.x + halfW - 1) / TILE);
  let top = Math.floor((player.y + 2) / TILE);
  let bot = Math.floor((player.y + player.h - 2) / TILE);

  for (let ty = top; ty <= bot; ty++) {
    for (let tx = left; tx <= right; tx++) {
      let b = getBlock(tx, ty);
      if (!isSolid(b)) continue;

      let blockLeft = tx * TILE;
      let blockRight = (tx + 1) * TILE;

      if (player.vx >= 0) {
        player.x = blockLeft - halfW;
      } else {
        player.x = blockRight + halfW;
      }
      player.vx = 0;
    }
  }
}

function resolveCollisionY() {
  let halfW = player.w / 2;
  let left = Math.floor((player.x - halfW + 3) / TILE);
  let right = Math.floor((player.x + halfW - 3) / TILE);
  let top = Math.floor(player.y / TILE);
  let bot = Math.floor((player.y + player.h) / TILE);
  player.onGround = false;

  for (let ty = top; ty <= bot; ty++) {
    for (let tx = left; tx <= right; tx++) {
      let b = getBlock(tx, ty);
      if (b === COL.AIR || b === COL.FLAG_POLE || b === COL.FLAG_TOP) continue;

      if (player.vy > 0) {
        player.y = ty * TILE - player.h;
        player.vy = 0;
        player.onGround = true;
      } else if (player.vy < 0) {
        player.y = (ty + 1) * TILE;
        player.vy = 0;
        hitBlock(tx, ty);
      }
    }
  }
}

function killPlayer() {
  if (player.invincible > 0 || player.dead) return;
  sfxDeath();
  player.dead = true;
  player.deadTimer = 60;
  // If falling off screen, don't bounce up
  if (player.y > H) {
    player.vy = 0;
  } else {
    player.vy = -8;
  }
  player.vx = 0;
}

function drawTile(bx, by, type) {
  let x = bx * TILE - camX, y = by * TILE;
  if (x < -TILE || x > W + TILE) return;

  switch (type) {
    case COL.GROUND:
      if (imgsReady && IMG.brick.complete) {
        ctx.drawImage(IMG.brick, x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#c84';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#a62';
        ctx.fillRect(x, y, TILE, 2);
        ctx.strokeStyle = '#852';
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
      }
      break;
    case COL.BRICK:
      if (imgsReady && IMG.brick.complete) {
        ctx.drawImage(IMG.brick, x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#c84';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.strokeStyle = '#852';
        ctx.lineWidth = 1;
        ctx.strokeRect(x + 0.5, y + 0.5, TILE - 1, TILE - 1);
        ctx.beginPath();
        ctx.moveTo(x, y + TILE / 2); ctx.lineTo(x + TILE, y + TILE / 2);
        ctx.moveTo(x + TILE / 2, y); ctx.lineTo(x + TILE / 2, y + TILE / 2);
        ctx.moveTo(x + TILE / 4, y + TILE / 2); ctx.lineTo(x + TILE / 4, y + TILE);
        ctx.moveTo(x + TILE * 3 / 4, y + TILE / 2); ctx.lineTo(x + TILE * 3 / 4, y + TILE);
        ctx.strokeStyle = '#963';
        ctx.stroke();
      }
      break;
    case COL.QUESTION:
      if (imgsReady && IMG.qblock.complete) {
        ctx.drawImage(IMG.qblock, x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#fa0';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#c80';
        ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
        ctx.fillStyle = '#fe0';
        ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
        ctx.fillStyle = '#850';
        ctx.font = 'bold 18px monospace';
        ctx.textAlign = 'center';
        ctx.fillText('?', x + TILE / 2, y + TILE / 2 + 6);
      }
      break;
    case COL.USED:
      ctx.fillStyle = '#886';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#664';
      ctx.fillRect(x + 2, y + 2, TILE - 4, TILE - 4);
      break;
    case COL.HARD:
      ctx.fillStyle = '#888';
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = '#666';
      ctx.fillRect(x + 1, y + 1, TILE - 2, TILE - 2);
      ctx.fillStyle = '#999';
      ctx.fillRect(x + 2, y + 2, TILE - 4, 2);
      break;
    case COL.PIPE_TL:
      if (imgsReady && IMG.pipe.complete) {
        ctx.drawImage(IMG.pipe, x - 4, y, TILE + 4, TILE);
      } else {
        ctx.fillStyle = '#0a0';
        ctx.fillRect(x - 4, y, TILE + 4, TILE);
        ctx.fillStyle = '#0d0';
        ctx.fillRect(x - 4, y, 6, TILE);
        ctx.fillStyle = '#080';
        ctx.fillRect(x + TILE - 2, y, 6, TILE);
      }
      break;
    case COL.PIPE_TR:
      if (imgsReady && IMG.pipe.complete) {
        ctx.drawImage(IMG.pipe, x, y, TILE + 4, TILE);
      } else {
        ctx.fillStyle = '#0a0';
        ctx.fillRect(x, y, TILE + 4, TILE);
        ctx.fillStyle = '#0d0';
        ctx.fillRect(x, y, 4, TILE);
        ctx.fillStyle = '#080';
        ctx.fillRect(x + TILE, y, 6, TILE);
      }
      break;
    case COL.PIPE_BL:
      if (imgsReady && IMG.pipe.complete) {
        ctx.drawImage(IMG.pipe, x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#0a0';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#0d0';
        ctx.fillRect(x, y, 4, TILE);
        ctx.fillStyle = '#080';
        ctx.fillRect(x + TILE - 2, y, 4, TILE);
      }
      break;
    case COL.PIPE_BR:
      if (imgsReady && IMG.pipe.complete) {
        ctx.drawImage(IMG.pipe, x, y, TILE, TILE);
      } else {
        ctx.fillStyle = '#0a0';
        ctx.fillRect(x, y, TILE, TILE);
        ctx.fillStyle = '#0d0';
        ctx.fillRect(x, y, 4, TILE);
        ctx.fillStyle = '#080';
        ctx.fillRect(x + TILE - 2, y, 4, TILE);
      }
      break;
    case COL.FLAG_POLE:
      ctx.fillStyle = '#0a0';
      ctx.fillRect(x + TILE / 2 - 2, y, 4, TILE);
      break;
    case COL.FLAG_TOP:
      ctx.fillStyle = '#888';
      ctx.fillRect(x + TILE / 2 - 3, y, 6, TILE);
      ctx.fillStyle = '#0a0';
      ctx.fillRect(x + TILE / 2 + 3, y + 4, 16, 12);
      break;
  }
}

function drawPlayer() {
  let px = player.x - camX, py = player.y;
  let f = player.facing;
  if (player.dead) {
    if (imgsReady && IMG.m_duck0.complete) {
      ctx.save();
      ctx.translate(px, py + player.h / 2);
      ctx.drawImage(IMG.m_duck0, -player.w, -player.h, player.w * 2, player.h * 2);
      ctx.restore();
    } else {
      ctx.fillStyle = '#f44';
      ctx.fillRect(px - 10, py, 20, player.h);
    }
    return;
  }
  if (player.invincible > 0 && animFrame % 4 < 2) return;

  if (imgsReady && IMG.m_idle0.complete) {
    marioAnimTimer++;
    if (marioAnimTimer > 5) { marioAnimTimer = 0; marioAnimFrame = (marioAnimFrame + 1) % 4; }

    let sprite;
    if (!player.onGround) {
      sprite = IMG['m_jump' + (marioAnimFrame % 4)];
    } else if (Math.abs(player.vx) > 0.5) {
      sprite = IMG['m_run' + marioAnimFrame];
    } else {
      sprite = IMG['m_idle' + marioAnimFrame];
    }

    if (sprite && sprite.complete) {
      ctx.save();
      ctx.translate(px, py + player.h / 2);
      if (f < 0) ctx.scale(-1, 1);
      ctx.drawImage(sprite, -player.w, -player.h, player.w * 2, player.h * 2);
      ctx.restore();
    }
  } else {
    ctx.save();
    ctx.translate(px, py);
    if (f < 0) ctx.scale(-1, 1);
    ctx.fillStyle = '#f00';
    ctx.fillRect(-10, 0, 20, 14);
    ctx.fillStyle = '#f80';
    ctx.fillRect(-10, 14, 20, 16);
    ctx.fillStyle = '#fff';
    ctx.fillRect(-3, -2, 4, 4);
    ctx.fillRect(4, -2, 4, 4);
    ctx.fillStyle = '#000';
    ctx.fillRect(-1, -1, 2, 2);
    ctx.fillRect(5, -1, 2, 2);
    ctx.fillStyle = '#48f';
    ctx.fillRect(-8, 30, 6, 6);
    ctx.fillRect(2, 30, 6, 6);
    ctx.restore();
  }
}

function drawEntity(e) {
  let x = e.x - camX, y = e.y;
  if (x < -50 || x > W + 50) return;

  if (e.type === 'goomba') {
    if (e.stomped > 0) {
      if (imgsReady && IMG.g_idle0 && IMG.g_idle0.complete) {
        ctx.drawImage(IMG.g_idle0, x - 2, y + e.h - 14, e.w + 4, 16);
      } else {
        ctx.fillStyle = '#a62';
        ctx.fillRect(x, y + e.h - 6, e.w, 6);
      }
      return;
    }
    if (imgsReady && IMG.g_walk0 && IMG.g_walk0.complete) {
      let walk = Math.floor(e.frame / 10) % 2;
      let sprite = walk ? IMG.g_walk1 : IMG.g_walk0;
      if (sprite && sprite.complete) {
        ctx.drawImage(sprite, x, y, e.w, e.h);
      }
    } else {
      ctx.fillStyle = '#a62';
      ctx.beginPath();
      ctx.ellipse(x + e.w / 2, y + e.h / 2, e.w / 2, e.h / 2, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  } else if (e.type === 'koopa') {
    if (e.stomped > 0) {
      if (imgsReady && IMG.k_shell0 && IMG.k_shell0.complete) {
        ctx.drawImage(IMG.k_shell0, x, y + e.h - 16, e.w, 16);
      } else {
        ctx.fillStyle = '#0a0';
        ctx.beginPath();
        ctx.ellipse(x + e.w / 2, y + e.h - 7, e.w / 2, 7, 0, 0, Math.PI * 2);
        ctx.fill();
      }
      return;
    }
    if (imgsReady && IMG.k_walk0 && IMG.k_walk0.complete) {
      let walk = Math.floor(e.frame / 12) % 2;
      let sprite = walk ? IMG.k_walk1 : IMG.k_walk0;
      if (sprite && sprite.complete) {
        ctx.drawImage(sprite, x - 2, y - 2, e.w + 4, e.h + 4);
      }
    } else {
      ctx.fillStyle = '#0a0';
      ctx.beginPath();
      ctx.ellipse(x + e.w / 2, y + 12, 12, 14, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#ff0';
      ctx.fillRect(x + 2, y + 6, 24, 12);
    }
  }
}

function draw() {
  if (titleScreen) { drawTitle(); return; }

  if (imgsReady && IMG.bg && IMG.bg.complete) {
    let bgW = IMG.bg.width;
    let bgX = -(camX * 0.3) % bgW;
    if (bgX > 0) bgX -= bgW;
    ctx.drawImage(IMG.bg, bgX, 0, bgW, H);
    ctx.drawImage(IMG.bg, bgX + bgW, 0, bgW, H);
    ctx.drawImage(IMG.bg, bgX + bgW * 2, 0, bgW, H);
  } else {
    ctx.fillStyle = '#5C94FC';
    ctx.fillRect(0, 0, W, H);
  }

  // clouds (skip if background image loaded)
  if (!imgsReady || !IMG.bg.complete) {
    ctx.fillStyle = '#6b8cff';
    ctx.fillRect(0, 0, W, H);
  }

  // draw clouds
  for (let i = 0; i < 10; i++) {
    let cx = (i * 350 + 80) - camX * 0.3;
    let cy = 40 + (i % 3) * 35;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 40, 18, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - 25, cy + 8, 25, 14, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 25, cy + 5, 30, 16, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // draw mountains
  for (let i = 0; i < 8; i++) {
    let mx = i * 500 - camX * 0.5;
    let my = (GROUND_Y) * TILE;
    ctx.fillStyle = '#2a8c2a';
    ctx.beginPath();
    ctx.ellipse(mx, my, 120, 60, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#3a9c3a';
    ctx.beginPath();
    ctx.ellipse(mx, my, 90, 45, 0, Math.PI, 0);
    ctx.fill();
  }

  // tiles
  for (let y = 0; y < MAP_H; y++) {
    for (let x = Math.floor(camX / TILE); x < Math.ceil((camX + W) / TILE) && x < MAP_W; x++) {
      if (grid[y][x] !== COL.AIR) drawTile(x, y, grid[y][x]);
    }
  }

  for (let e of entities) drawEntity(e);
  drawPlayer();

  for (let p of particles) {
    if (p.type === 'coin') {
      if (imgsReady && IMG.coin_f0.complete) {
        coinAnimTimer++;
        if (coinAnimTimer > 6) { coinAnimTimer = 0; coinAnimFrame = (coinAnimFrame + 1) % 4; }
        let frames = [IMG.coin_f0, IMG.coin_f1, IMG.coin_f2, IMG.coin_f3];
        ctx.drawImage(frames[coinAnimFrame], p.x - camX - 10, p.y - 10, 20, 20);
      } else {
        ctx.fillStyle = '#ff0';
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, 6, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#fa0';
        ctx.beginPath();
        ctx.arc(p.x - camX, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
      }
    } else {
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - camX, p.y, p.size, p.size);
    }
  }

  for (let f of floatingTexts) {
    ctx.font = 'bold 14px monospace';
    ctx.fillStyle = '#fff';
    ctx.textAlign = 'center';
    ctx.fillText(f.text, f.x - camX, f.y);
  }

  // HUD
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, W, 55);
  ctx.strokeStyle = '#333';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(0, 55);
  ctx.lineTo(W, 55);
  ctx.stroke();

  ctx.font = 'bold 14px monospace';
  ctx.textAlign = 'left';
  ctx.fillStyle = '#fff';
  ctx.fillText('MARIO', 20, 18);
  ctx.fillStyle = '#aaa';
  ctx.fillText(String(score).padStart(6, '0'), 20, 36);

  // Hearts
  if (imgsReady && IMG.heart_full && IMG.heart_full.complete) {
    for (let i = 0; i < 3; i++) {
      let hx = 20 + i * 22;
      if (i < lives) ctx.drawImage(IMG.heart_full, hx, 40, 14, 14);
      else ctx.drawImage(IMG.heart_empty, hx, 40, 14, 14);
    }
  } else {
    ctx.fillStyle = '#f44';
    ctx.fillText('♥ x' + lives, 20, 50);
  }

  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText('WORLD 1-1', W / 2, 18);

  // Coin icon
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(W / 2 - 42, 32, 7, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#DAA520';
  ctx.beginPath();
  ctx.arc(W / 2 - 42, 32, 3, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.fillText('x' + String(coins).padStart(3, '0'), W / 2 + 5, 38);

  ctx.textAlign = 'right';
  ctx.fillText('TIME', W - 20, 18);
  ctx.fillText(String(Math.max(0, Math.floor(levelTimer))), W - 20, 36);

  // 调试信息 - 在 HUD 上显示 Mario 位置
  if (!titleScreen && !gameOver && !won) {
    let ptx = Math.floor(player.x / TILE);
    ctx.fillStyle = '#ff0';
    ctx.textAlign = 'left';
    ctx.fillText('pos=' + Math.floor(player.x) + ' tile=' + ptx + ' flag=185', 200, 46);
  }

  if (gameOver) {
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);
    if (imgsReady && IMG.gameover.complete) {
      ctx.drawImage(IMG.gameover, W / 2 - 150, H / 2 - 85, 300, 170);
    } else {
      ctx.font = 'bold 40px monospace';
      ctx.fillStyle = '#f44';
      ctx.textAlign = 'center';
      ctx.fillText('GAME OVER', W / 2, H / 2 - 10);
    }
    ctx.font = '18px monospace';
    ctx.fillStyle = '#aaa';
    ctx.textAlign = 'center';
    ctx.fillText('Score: ' + score + (isMobile ? '  👆 点击重玩' : '  按 R 重新开始'), W / 2, H / 2 + 100);
  }

  if (won) {
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.fillRect(0, 0, W, H);
    ctx.font = 'bold 36px monospace';
    ctx.fillStyle = '#ff0';
    ctx.textAlign = 'center';
    ctx.fillText('COURSE CLEAR!', W / 2, H / 2 - 20);
    ctx.font = '20px monospace';
    ctx.fillStyle = '#fff';
    ctx.fillText('Score: ' + score, W / 2, H / 2 + 15);
    ctx.font = '16px monospace';
    ctx.fillStyle = '#aaa';
    ctx.fillText(isMobile ? '👆 点击屏幕重新开始' : '按 R 重新开始', W / 2, H / 2 + 45);
  }
}

document.addEventListener('keydown', e => {
  keys[e.key] = true;
  if (titleScreen) {
    if (e.key === 'Enter' || e.key === ' ') {
      titleScreen = false;
      init();
      startBGM();
    }
  } else if (gameOver || won) {
    if (e.key === 'r' || e.key === 'R') { lives = 3; resetLevel(); startBGM(); }
  }
  e.preventDefault();
});
document.addEventListener('keyup', e => { keys[e.key] = false; });

// ===== Mobile Touch Controls =====
let touchControls = { left: false, right: false, jump: false };
let isMobile = /Android|iPhone|iPad|iPod|webOS/i.test(navigator.userAgent) || ('ontouchstart' in window && window.innerWidth < 1024);

function setupTouchControls() {
  if (!isMobile) return;

  // Scale canvas to fit screen
  function resizeCanvas() {
    const ratio = W / H;
    let sw = window.innerWidth, sh = window.innerHeight;
    // Reserve space for controls at bottom
    let controlH = 120;
    let availH = sh - controlH;
    if (sw / availH > ratio) {
      canvas.style.height = availH + 'px';
      canvas.style.width = (availH * ratio) + 'px';
    } else {
      canvas.style.width = sw + 'px';
      canvas.style.height = (sw / ratio) + 'px';
    }
  }
  resizeCanvas();
  window.addEventListener('resize', resizeCanvas);

  // Create touch button UI
  const btnContainer = document.createElement('div');
  btnContainer.style.cssText = 'position:fixed;bottom:0;left:0;right:0;height:120px;display:flex;justify-content:space-between;align-items:center;padding:0 16px;z-index:999;';

  // Left side: D-pad
  const dpad = document.createElement('div');
  dpad.style.cssText = 'display:flex;gap:8px;';

  function makeBtn(text, w) {
    const b = document.createElement('button');
    b.textContent = text;
    b.style.cssText = `width:${w}px;height:80px;font-size:28px;border:none;border-radius:16px;background:rgba(255,255,255,0.2);color:#fff;touch-action:none;-webkit-user-select:none;user-select:none;display:flex;align-items:center;justify-content:center;`;
    return b;
  }

  const btnLeft = makeBtn('◀', 80);
  const btnRight = makeBtn('▶', 80);

  // Right side: Jump
  const jumpArea = document.createElement('div');
  const btnJump = makeBtn('跳', 120);
  btnJump.style.background = 'rgba(255,80,80,0.35)';

  // Touch handlers
  function bindTouch(btn, key) {
    btn.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; btn.style.background = 'rgba(255,255,255,0.5)'; }, { passive: false });
    btn.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; btn.style.background = 'rgba(255,255,255,0.2)'; }, { passive: false });
    btn.addEventListener('touchcancel', e => { keys[key] = false; btn.style.background = 'rgba(255,255,255,0.2)'; });
  }
  bindTouch(btnLeft, 'ArrowLeft');
  bindTouch(btnRight, 'ArrowRight');
  btnJump.addEventListener('touchstart', e => { e.preventDefault(); keys['ArrowUp'] = true; keys[' '] = true; btnJump.style.background = 'rgba(255,80,80,0.6)'; }, { passive: false });
  btnJump.addEventListener('touchend', e => { e.preventDefault(); keys['ArrowUp'] = false; keys[' '] = false; btnJump.style.background = 'rgba(255,80,80,0.35)'; }, { passive: false });
  btnJump.addEventListener('touchcancel', e => { keys['ArrowUp'] = false; keys[' '] = false; btnJump.style.background = 'rgba(255,80,80,0.35)'; });

  dpad.appendChild(btnLeft);
  dpad.appendChild(btnRight);
  jumpArea.appendChild(btnJump);
  btnContainer.appendChild(dpad);
  btnContainer.appendChild(jumpArea);
  document.body.appendChild(btnContainer);

  // Title screen: tap canvas to start
  canvas.addEventListener('touchstart', function onTap(e) {
    if (titleScreen) { titleScreen = false; init(); startBGM(); }
    else if (gameOver || won) { lives = 3; resetLevel(); startBGM(); }
  }, { passive: true });
}
setupTouchControls();

function loop() {
  try {
    update();
    draw();
  } catch(err) {
    ctx.fillStyle = '#f00';
    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText('ERROR: ' + err.message, 10, H - 10);
    console.error(err);
  }
  requestAnimationFrame(loop);
}

function drawTitle() {
  // Sky gradient background
  let grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#5C94FC');
  grad.addColorStop(0.6, '#87CEEB');
  grad.addColorStop(1, '#56A64A');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  // Hills
  for (let i = 0; i < 6; i++) {
    let hx = i * 180 - 50;
    ctx.fillStyle = '#2D8B2D';
    ctx.beginPath();
    ctx.ellipse(hx, H - 30, 120, 65, 0, Math.PI, 0);
    ctx.fill();
    ctx.fillStyle = '#3DAB3D';
    ctx.beginPath();
    ctx.ellipse(hx, H - 30, 85, 45, 0, Math.PI, 0);
    ctx.fill();
  }

  // Ground
  ctx.fillStyle = '#C84C09';
  ctx.fillRect(0, H - 40, W, 40);
  ctx.fillStyle = '#E09050';
  ctx.fillRect(0, H - 40, W, 6);

  // Clouds
  for (let i = 0; i < 8; i++) {
    let cx = 60 + i * 110;
    let cy = 40 + (i % 3) * 30;
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.beginPath();
    ctx.ellipse(cx, cy, 38, 16, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx - 22, cy + 7, 24, 13, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(cx + 24, cy + 4, 28, 14, 0, 0, Math.PI * 2);
    ctx.fill();
  }

  // Title text - "MARIO'S" in red
  ctx.save();
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';

  // Shadow
  ctx.font = 'bold 52px "Press Start 2P", monospace';
  ctx.fillStyle = '#000';
  ctx.fillText("MARIO'S", W / 2 + 3, 103);
  ctx.fillText("ADVENTURE", W / 2 + 3, 163);

  // Main text
  ctx.fillStyle = '#E4211A';
  ctx.fillText("MARIO'S", W / 2, 100);
  ctx.fillStyle = '#F5C518';
  ctx.fillText("ADVENTURE", W / 2, 160);

  // Outline effect
  ctx.strokeStyle = '#000';
  ctx.lineWidth = 2;
  ctx.strokeText("MARIO'S", W / 2, 100);
  ctx.strokeText("ADVENTURE", W / 2, 160);

  ctx.restore();

  // Mario sprite - bounce animation
  if (imgsReady && IMG.m_portrait && IMG.m_portrait.complete) {
    let bounce = Math.sin(Date.now() / 300) * 12;
    ctx.drawImage(IMG.m_portrait, W / 2 - 30, 200 + bounce, 60, 60);
  } else if (imgsReady && IMG.m_idle0 && IMG.m_idle0.complete) {
    let bounce = Math.sin(Date.now() / 300) * 12;
    ctx.drawImage(IMG.m_idle0, W / 2 - 20, 200 + bounce, 40, 50);
  }

  // Coin decoration
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(W / 2 + 55, 220, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#DAA520';
  ctx.beginPath();
  ctx.arc(W / 2 + 55, 220, 4, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#FFD700';
  ctx.beginPath();
  ctx.arc(W / 2 - 55, 220, 8, 0, Math.PI * 2);
  ctx.fill();
  ctx.fillStyle = '#DAA520';
  ctx.beginPath();
  ctx.arc(W / 2 - 55, 220, 4, 0, Math.PI * 2);
  ctx.fill();

  // Start prompt
  let alpha = 0.5 + 0.5 * Math.sin(Date.now() / 400);
  ctx.globalAlpha = alpha;
  ctx.font = 'bold 20px monospace';
  ctx.fillStyle = '#fff';
  ctx.textAlign = 'center';
  ctx.fillText(isMobile ? '👆 点击屏幕开始' : 'PRESS SPACE TO START', W / 2, H - 80);
  ctx.globalAlpha = 1;
}

init();
loop();
</script>
</body>
